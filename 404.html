<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Windlass Mobile Detailing</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Jost:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap');
  :root{
    --navy-deep:#0a1a2c;
    --navy:#0e2137;
    --navy-line: rgba(201,168,90,0.18);
    --foam:#f3f0e6;
    --foam-dim:#c9d3da;
    --brass:#c9a24b;
    --brass-bright:#e4bf6f;
    --text-muted:#8ea2b5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(ellipse 900px 500px at 80% -10%, rgba(201,168,90,0.08), transparent 60%),
      radial-gradient(ellipse 700px 500px at 10% 0%, rgba(79,143,138,0.10), transparent 55%),
      var(--navy-deep);
    color:var(--foam);
    font-family:'Jost', sans-serif;
    text-align:center;
    padding:32px;
  }
  .box{max-width:520px;}
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;letter-spacing:0.22em;text-transform:uppercase;
    color:var(--brass);display:block;margin-bottom:18px;
  }
  .code{
    font-family:'Fraunces', serif;
    font-size:clamp(4rem,14vw,7rem);
    line-height:1;color:var(--foam);font-weight:600;margin:0;
  }
  .code em{font-style:italic;color:var(--brass-bright);}
  h1{
    font-family:'Fraunces', serif;font-weight:600;
    font-size:clamp(1.4rem,3vw,2rem);margin:20px 0 0;color:var(--foam);
  }
  p{color:var(--foam-dim);line-height:1.6;font-size:1.02rem;margin:16px 0 0;}
  .cta{
    display:inline-flex;align-items:center;gap:8px;margin-top:34px;
    background:var(--brass);color:var(--navy-deep);
    font-family:'IBM Plex Mono',monospace;font-size:0.82rem;letter-spacing:0.03em;
    padding:15px 26px;border-radius:2px;font-weight:500;text-decoration:none;
    transition:transform .15s ease, background .15s ease;
  }
  .cta:hover{background:var(--brass-bright);transform:translateY(-1px);}
</style>
</head>
<body>
  <div class="box">
    <span class="eyebrow">Windlass Mobile Detailing</span>
    <p class="code">4<em>0</em>4</p>
    <h1>This page drifted off course.</h1>
    <p>The page you're looking for isn't here. Let's get you back to dry dock.</p>
    <a class="cta" href="/">Back to Home →</a>
  </div>
</body>
</html>
